services:
  telefonos-internos:
    build: .
    container_name: telefonos-internos
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      HOST: 0.0.0.0
      PORT: 5173
      DIR_DATOS: /app/data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Crea .env con ADMIN_PASSWORD}
    volumes:
      - ./data:/app/data